<svg xmlns="http://www.w3.org/2000/svg" width="880" height="392" viewBox="0 0 880 392" role="img" aria-label="Architecture: the UI and CLI reach read and write paths; the MCP runtime is wired only to the read path, so writes are unreachable rather than disabled">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5d6878"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4cc4ff"/>
    </marker>
  </defs>

  <rect width="880" height="392" rx="14" fill="#0e1116" stroke="#2a313c"/>
  <g font-family="'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">
    <text x="32" y="42" font-size="15" font-weight="600" fill="#d7dde5">Where the write boundary lives</text>
    <text x="32" y="64" font-size="12.5" fill="#8b97a7">The agent surface has no code path to the write functions — not a flag, not a policy check.</text>

    <!-- callers -->
    <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5">
      <g transform="translate(32 100)">
        <rect width="176" height="52" rx="9" fill="#161b22" stroke="#2a313c"/>
        <text x="16" y="23" fill="#d7dde5">UI + CLI</text>
        <text x="16" y="40" fill="#5d6878" font-size="11">local human</text>
      </g>
      <g transform="translate(32 180)">
        <rect width="176" height="52" rx="9" fill="#161b22" stroke="#2a313c"/>
        <text x="16" y="23" fill="#d7dde5">Integration API</text>
        <text x="16" y="40" fill="#5d6878" font-size="11">scoped bearer token</text>
      </g>
      <g transform="translate(32 260)">
        <rect width="176" height="52" rx="9" fill="#0f2430" stroke="#2f6c8a"/>
        <text x="16" y="23" fill="#4cc4ff">MCP runtime</text>
        <text x="16" y="40" fill="#5d6878" font-size="11">agents</text>
      </g>

      <!-- paths -->
      <g transform="translate(392 100)">
        <rect width="196" height="72" rx="9" fill="#161b22" stroke="#3a4452"/>
        <text x="16" y="27" fill="#d7dde5">write path</text>
        <text x="16" y="46" fill="#5d6878" font-size="11">publish · purge · delete</text>
        <text x="16" y="61" fill="#5d6878" font-size="11">consumers · streams · KV</text>
      </g>
      <g transform="translate(392 224)">
        <rect width="196" height="72" rx="9" fill="#0f2430" stroke="#2f6c8a"/>
        <text x="16" y="27" fill="#4cc4ff">read path</text>
        <text x="16" y="46" fill="#5d6878" font-size="11">Query Engine · bounded</text>
        <text x="16" y="61" fill="#5d6878" font-size="11">cursors · limits · audit</text>
      </g>

      <g transform="translate(700 162)">
        <rect width="148" height="68" rx="9" fill="#161b22" stroke="#2a313c"/>
        <text x="20" y="30" fill="#d7dde5">NATS</text>
        <text x="20" y="49" fill="#5d6878" font-size="11">JetStream</text>
      </g>
    </g>

    <!-- edges -->
    <g fill="none" stroke="#5d6878" stroke-width="1.6" marker-end="url(#a)">
      <path d="M208 118 C 300 118, 300 130, 388 130"/>
      <path d="M208 140 C 300 140, 300 250, 388 254"/>
      <path d="M208 200 C 300 200, 300 150, 388 148"/>
      <path d="M208 214 C 300 214, 300 262, 388 264"/>
      <path d="M588 136 C 650 136, 650 186, 696 186"/>
    </g>
    <g fill="none" stroke="#4cc4ff" stroke-width="1.8" marker-end="url(#aa)">
      <path d="M208 286 C 300 286, 320 276, 388 274"/>
      <path d="M588 268 C 650 268, 650 212, 696 208"/>
    </g>

    <!-- the missing edge -->
    <g>
      <path d="M208 268 C 290 268, 320 150, 384 140" fill="none" stroke="#f85149" stroke-width="1.6" stroke-dasharray="5 5" opacity="0.5"/>
      <g transform="translate(286 186)">
        <circle r="11" fill="#0e1116" stroke="#f85149" stroke-width="1.6"/>
        <path d="M-4.4 -4.4 L4.4 4.4 M4.4 -4.4 L-4.4 4.4" stroke="#f85149" stroke-width="1.9" stroke-linecap="round"/>
      </g>
      <text x="300" y="212" font-size="11.5" fill="#f85149" font-family="'JetBrains Mono',ui-monospace,monospace">no such import</text>
    </g>

    <text x="32" y="352" font-size="11.5" fill="#5d6878" font-family="'JetBrains Mono',ui-monospace,monospace">executeMcpTool(name, input, data: McpRuntimeData)  —  the interface has no write members to call</text>
  </g>
</svg>
