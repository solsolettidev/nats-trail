<svg xmlns="http://www.w3.org/2000/svg" width="880" height="248" viewBox="0 0 880 248" role="img" aria-label="A single request id traced across four streams, reconstructed in chronological order ending in a dead letter event">
  <rect width="880" height="248" rx="14" fill="#0e1116" stroke="#2a313c"/>
  <g font-family="'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">
    <text x="32" y="40" font-size="15" font-weight="600" fill="#d7dde5">One id, every stream, in order</text>
    <text x="32" y="62" font-size="12.5" fill="#8b97a7">
      <tspan font-family="'JetBrains Mono',ui-monospace,monospace" fill="#4cc4ff">natstrail.trace_by_request_id</tspan>
      <tspan> sweeps each stream and merges the matches chronologically.</tspan>
    </text>
  </g>

  <g font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">
    <line x1="48" y1="146" x2="828" y2="146" stroke="#2a313c" stroke-width="1.5"/>

    <g transform="translate(48 146)">
      <circle r="6" fill="#4cc4ff"/>
      <text x="-4" y="-18" fill="#d7dde5">source.created</text>
      <text x="-4" y="26" fill="#5d6878" font-size="10.5">SOURCE_EVENTS · 12:04:01</text>
    </g>
    <g transform="translate(248 146)">
      <circle r="6" fill="#4cc4ff"/>
      <text x="-4" y="-18" fill="#d7dde5">refresh.started</text>
      <text x="-4" y="26" fill="#5d6878" font-size="10.5">SOURCE_EVENTS · 12:04:02</text>
    </g>
    <g transform="translate(452 146)">
      <circle r="6" fill="#d29922"/>
      <text x="-4" y="-18" fill="#d7dde5">bronze.etl.started</text>
      <text x="-4" y="26" fill="#5d6878" font-size="10.5">ETL_EVENTS · 12:04:09</text>
    </g>
    <g transform="translate(652 146)">
      <circle r="6" fill="#f85149"/>
      <text x="-4" y="-18" fill="#f85149">bronze.etl.failed</text>
      <text x="-4" y="26" fill="#5d6878" font-size="10.5">ETL_EVENTS · 12:04:41</text>
    </g>
    <g transform="translate(818 146)">
      <circle r="6" fill="#f85149"/>
      <text x="-92" y="-18" fill="#f85149">dlq.message.created</text>
      <text x="-104" y="26" fill="#5d6878" font-size="10.5">DLQ_EVENTS · 12:04:42</text>
    </g>

    <g transform="translate(32 200)">
      <rect width="816" height="30" rx="7" fill="#161b22" stroke="#2a313c"/>
      <text x="16" y="20" fill="#8b97a7" font-size="11.5">
        <tspan fill="#5d6878">$</tspan>
        <tspan fill="#d7dde5"> nats-trail trace --request-id req-8f21c --limit 20</tspan>
        <tspan fill="#5d6878">   # or ask an agent "why did this refresh fail?"</tspan>
      </text>
    </g>
  </g>
</svg>
