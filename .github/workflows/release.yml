name: Release

on:
  push:
    tags: ["v*"]

# Publishes with npm trusted publishing (OIDC). There is no token anywhere: the
# runner exchanges a short-lived, signed GitHub identity for publish rights, and
# npm generates provenance attestations automatically.
#
# Each package has its trusted publisher configured on npmjs.com pointing at:
#   owner/repo:   solsolettidev/nats-trail
#   workflow:     release.yml
#   environment:  release
#
# Deliberately no NODE_AUTH_TOKEN fallback: setup-node writes the value into
# .npmrc even when it is empty, and `_authToken=` is worse than no auth line at
# all — it turns a missing trusted publisher into a confusing auth error.

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm 11.5.1+; the runner ships an older 10.x.
      - run: npm install -g npm@latest
      - run: npm --version

      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

      # Dependency order: core <- mcp <- ui/server <- nats-trail
      - name: Publish packages
        run: |
          for pkg in core mcp ui server cli; do
            echo "::group::publish $pkg"
            npm publish --workspace "packages/$pkg" --access public
            echo "::endgroup::"
          done

      # ---- MCP Registry ------------------------------------------------------
      #
      # The registry only stores metadata and verifies it against the npm
      # package, so this has to run after the publish above — and after npm has
      # actually served the new version, hence the wait.

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Wait for npm to serve the new version
        run: |
          VERSION=$(node -p "require('./packages/mcp/package.json').version")
          echo "waiting for @nats-trail/mcp@$VERSION"
          for i in $(seq 1 30); do
            if curl -sf "https://registry.npmjs.org/@nats-trail/mcp/$VERSION" > /dev/null; then
              echo "available after $((i * 10))s"
              exit 0
            fi
            sleep 10
          done
          echo "::error::@nats-trail/mcp@$VERSION never appeared on npm; the registry would reject it"
          exit 1

      # OIDC again: no MCP_GITHUB_TOKEN secret, same id-token permission.
      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to the MCP Registry
        working-directory: packages/mcp
        run: ../../mcp-publisher publish
