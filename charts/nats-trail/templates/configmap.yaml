{{- if .Values.config.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nats-trail.fullname" . }}-config
  labels:
    {{- include "nats-trail.labels" . | nindent 4 }}
data:
  # Read at startup and asserted on every restart. Credentials belong in a
  # Secret and are referenced from here as ${VAR}, resolved from the container
  # environment — an unset variable stops the deployment rather than connecting
  # with a blank password.
  nats-trail.json: |
    {{- dict "contexts" .Values.config.contexts "correlationKeys" .Values.config.correlationKeys | toPrettyJson | nindent 4 }}
{{- end }}
